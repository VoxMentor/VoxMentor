name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore VoxMentor.slnx
      - name: Build
        run: dotnet build VoxMentor.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test VoxMentor.slnx --no-build --configuration Release

  scripts:
    # scripts/test_seed_corpus.py guards the seeded corpus list (#75): 50
    # concepts, unique article URLs, chunk counts that must match TextChunker.cs.
    # Those URLs are third-party and rot silently, so keep the test in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r scripts/requirements-seed.txt
      - name: Test
        run: python -m unittest scripts.test_seed_corpus

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
