services:
  db:
    image: pgvector/pgvector:pg15
    container_name: voxmentor-db
    environment:
      - POSTGRES_USER=voxmentor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set - copy .env.example to .env}
      - POSTGRES_DB=voxmentor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temp init server is socket-only,
      # so a socket check could mark db healthy before the real server listens.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U voxmentor -d voxmentor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies idempotent schema prerequisites (vector extension,
  # judge0 database) on every `up`, so upgraded volumes work too -
  # postgres only runs docker-entrypoint-initdb.d on a fresh data dir.
  db-ensure:
    image: pgvector/pgvector:pg15
    container_name: voxmentor-db-ensure
    environment:
      - POSTGRES_USER=voxmentor
      - POSTGRES_DB=voxmentor
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set - copy .env.example to .env}
    volumes:
      - ./scripts/init-db.sh:/ensure.sh:ro
    entrypoint: ["/bin/bash", "/ensure.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: voxmentor-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: voxmentor-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ponytail: ollama image ships no curl - `ollama list` is the image-native probe
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0:
    image: judge0/judge0:latest
    container_name: voxmentor-judge0
    environment:
      - SECRET_KEY=${JUDGE0_SECRET_KEY:?JUDGE0_SECRET_KEY not set - copy .env.example to .env}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=voxmentor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set - copy .env.example to .env}
      - POSTGRES_DB=judge0
      - REDIS_HOST=redis
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-ensure:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2358/configs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Judge0's reference stack runs workers in a separate container;
  # without it the API accepts submissions but never executes them.
  judge0-worker:
    image: judge0/judge0:latest
    container_name: voxmentor-judge0-worker
    # ponytail: upstream judge0 compose runs the worker privileged (isolate
    # sandbox requirement); local dev only, API bound to 127.0.0.1 - see
    # github.com/judge0/judge0/security/advisories/GHSA-q7vg-26pg-v5hr
    privileged: true
    command: ["./scripts/workers"]
    environment:
      - SECRET_KEY=${JUDGE0_SECRET_KEY:?JUDGE0_SECRET_KEY not set - copy .env.example to .env}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=voxmentor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set - copy .env.example to .env}
      - POSTGRES_DB=judge0
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-ensure:
        condition: service_completed_successfully

  seq:
    image: datalust/seq:2024.3.3
    container_name: voxmentor-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - seq-data:/data

  # Gateway — uncomment and set env vars when running in Docker.
  # In containers, use service DNS names instead of localhost.
  # gateway:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.Gateway
  #   environment:
  #     - ConnectionStrings__Hangfire=Host=db;Port=5432;Database=voxmentor;Username=voxmentor;Password=${POSTGRES_PASSWORD}
  #     - ReverseProxy__Clusters__core-api__Destinations__d1__Address=http://api:5000/
  #     - ReverseProxy__Clusters__tutor-service__Destinations__d1__Address=http://tutor:5001/
  #     - ReverseProxy__Clusters__codeexec-service__Destinations__d1__Address=http://codeexec:5002/
  #     - Serilog__WriteTo__1__Args__serverUrl=http://seq:80
  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   depends_on:
  #     - seq

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  seq-data:
