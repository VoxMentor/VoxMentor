services:
  redis:
    image: redis:7-alpine
    container_name: voxmentor-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: voxmentor-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ponytail: ollama image ships no curl - `ollama list` is the image-native probe
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:2024.3.3
    container_name: voxmentor-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - seq-data:/data

  # OpenTelemetry collector (#154). Every service exports OTLP here over
  # http/protobuf on 4318, so one trace covers the API, the gateway and the
  # voice service. The debug exporter prints the spans to the collector's
  # stdout - `docker compose logs otel-collector` shows the trace.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: voxmentor-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  voice-service:
    build:
      context: ./voice-service
    container_name: voxmentor-voice
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - VOICE_MODELS_DIR=/models
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - PIPER_VOICE=${PIPER_VOICE:-en_US-amy-medium}
      # Traces (#154): export to the shared collector by default. The
      # VOICE_-prefixed names are deliberate: a host-shell
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (set for the
      # host-run API/gateway, see docs/tracing.md) must not leak into the
      # container, where localhost is the container itself. Unset -> the
      # default collector; set VOICE_OTEL_EXPORTER_OTLP_ENDPOINT= (empty) to
      # turn the export off - the service then records spans and drops them.
      # ${VAR-default} is unset-only on purpose: :- would override an
      # explicitly empty value back to the default.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${VOICE_OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${VOICE_OTEL_EXPORTER_OTLP_PROTOCOL-http/protobuf}
      - OTEL_SERVICE_NAME=voxmentor-voice-service
    depends_on:
      - otel-collector
    volumes:
      - voice-models:/models
    healthcheck:
      # slim image has no curl; urllib is the language-native probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # first `up` builds/pip-installs; models download lazily after healthy
      start_period: 30s

  # Gateway — uncomment and set env vars when running in Docker.
  # In containers, use service DNS names instead of localhost.
  # gateway:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.Gateway
  #   environment:
  #     - ConnectionStrings__Hangfire=Host=<supabase-host>;Port=5432;Database=postgres;Username=postgres;Password=${SUPABASE_PASSWORD}
  #     - ReverseProxy__Clusters__core-api__Destinations__d1__Address=http://api:5000/
  #     - ReverseProxy__Clusters__tutor-service__Destinations__d1__Address=http://tutor:5001/
  #     - ReverseProxy__Clusters__codeexec-service__Destinations__d1__Address=http://codeexec:5002/
  #     - ReverseProxy__Clusters__voice-service__Destinations__d1__Address=http://voice-service:8001/
  #     - Serilog__WriteTo__1__Args__serverUrl=http://seq:80
  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   depends_on:
  #     - seq

  # Judge0 (opt-in) — uncomment judge0-db, judge0 and judge0-worker to run the
  # local code-execution stack. Judge0 needs its own PostgreSQL; judge0-db is
  # that database and is NOT the API's Supabase database. Without this stack,
  # VoxMentor.CodeExecService defaults to http://localhost:2358 and you must
  # provision Judge0 separately (or set Judge0:BaseUrl to a remote endpoint).
  # judge0-db:
  #   image: postgres:16-alpine
  #   container_name: voxmentor-judge0-db
  #   environment:
  #     - POSTGRES_USER=judge0
  #     - POSTGRES_DB=judge0
  #     - POSTGRES_PASSWORD=${JUDGE0_DB_PASSWORD:?JUDGE0_DB_PASSWORD not set - copy .env.example to .env}
  #   volumes:
  #     - judge0-db-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U judge0"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #
  # judge0:
  #   image: judge0/judge0:latest
  #   container_name: voxmentor-judge0
  #   environment:
  #     - SECRET_KEY=${JUDGE0_SECRET_KEY:?JUDGE0_SECRET_KEY not set - copy .env.example to .env}
  #     - POSTGRES_HOST=judge0-db
  #     - POSTGRES_PORT=5432
  #     - POSTGRES_USER=judge0
  #     - POSTGRES_PASSWORD=${JUDGE0_DB_PASSWORD:?JUDGE0_DB_PASSWORD not set - copy .env.example to .env}
  #     - POSTGRES_DB=judge0
  #     - REDIS_HOST=redis
